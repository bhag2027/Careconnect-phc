{% include 'doctor_header.html' %}

<style>
.checked { color: orange; }
body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #f5f5f5; 
    margin: 0; 
    padding: 0; 
}
.container { max-width: 1200px; margin: 20px auto; }

.table { 
    width: 100%; 
    border-collapse: collapse; 
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); 
    overflow: hidden; 
    border-radius: 8px; 
}
th, td { 
    padding: 15px; 
    text-align: left; 
    border-bottom: 1px solid #ddd; 
}
th { background-color: #3498db; color: #fff; }
.btn { 
    text-decoration: none; 
    padding: 10px 20px; 
    border-radius: 5px; 
    display: inline-block; 
}
.btn-primary { background-color: #2ecc71; color: #fff; }
</style>

<!-- ======= Hero Section ======= -->
<section id="hero" class="d-flex flex-column justify-content-center">
    <div class="container" data-aos="zoom-in" data-aos-delay="100">
        <p>
            <span data-typed-items="View Doctor" 
                  style="font-family:bold; color:white; font-size:50px">TEST RESULT</span>
        </p>

        <form method="post">
            <table class="table" style="background-color: rgba(0, 0, 0, 0.7); color:white">
                <tr style="background-color:#3498DB">
                    <th>Sl.no</th>
                    <th>Patient Name</th>
                    <th>Date & Time</th>
                    <th>File</th>
                </tr>

                {% for row in data['results'] %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ row['patient_name'] }}</td>
                    <td>{{ row['test_reult_date'] }} - {{ row['test_reult_time'] }}</td>
                    <td>
                        <a href="/{{ row['result'] }}" class="btn btn-primary" target="_blank">View Result</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </form>
    </div>
</section>

{% include 'footer.html' %}
