<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Health Care</title>
  <link href="/static/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/assets/css/style.css" rel="stylesheet">
</head>

<body>
  <section id="hero" class="d-flex flex-column justify-content-center">
    <div class="container" data-aos="zoom-in" data-aos-delay="100">
      <div class="row">
        {% for row in data['view'] %}
        <div class="col-md-4 mb-3">
          <div class="card" style="background-color: rgba(145, 215, 212, 0.7); color: white; border-radius: 15px;">
            <div class="card-body">
              <h5 class="card-title">Event: {{ row['event'] }}</h5>
              <p class="card-text"><strong>Description:</strong> {{ row['description'] }}</p>
              <p class="card-text"><strong>Date:</strong> {{ row['date'] }}</p>
              <p class="card-text"><strong>Time:</strong> {{ row['time'] }}</p> <!-- Now shows time with AM/PM -->


            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
</body>
</html>
