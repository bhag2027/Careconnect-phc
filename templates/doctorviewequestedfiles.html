{% include 'doctor_header.html' %}

<!-- ======= Hero Section ======= -->
<section id="hero" class="d-flex flex-column justify-content-center">
	<div class="container" data-aos="zoom-in" data-aos-delay="100">
	  <!-- <h1></h1> -->
	  <p><span data-typed-items="View Records">RECORDS</span></p>
{% if data['mid'] %}

<form method="post">
	<table  class="table" style="width: 500px; " >
		<tr>
			<th>Enter Key</th>
			<td><input type="text" name="key" class="form-control" style="background-color: #00000080 ; color: #fff"></td>
		</tr>
		
		<tr>
			<td colspan="2" align="center"><input type="submit" name="submit" class="btn btn-warning"></td>
		</tr>
		
	</table>
	</form>
{% else %}
	  <p><span class="typed" data-typed-items="View File"></span></p>

	<table    style="width: 900px; background-color: rgba(0, 0, 0, 0.7);color:white" >
		
		<tr>
			<th>Sno</th>
			<!-- <th>Doctor</th> -->
			<th>Date Time</th>
			
		</tr>
		{% for row in data['val'] %}

		<tr>
			<td>{{ loop.index }}</td>
			<!-- <td>{{ row['dname'] }}</td> -->
			<td>{{ row['date_time'] }}</td>
			<!-- <td><a href="download?mid={{ row['medical_record_id'] }}" class="btn btn-primary">Download</a></td> -->
			<td>{{row['status']}}</td>
			{% if row['status']=='accept' %}
			<td><a href="?mid={{ row['medical_record_id'] }}&pid={{ data['pid'] }}" class="btn btn-primary">Download</a></td>
			{% endif %}
			




		</tr>

		{% endfor %}

	</table>

{% endif %}	
</div>
</section><!-- End Hero -->

<main id="main">

{% include 'footer.html' %}
