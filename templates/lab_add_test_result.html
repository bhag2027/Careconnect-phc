{% include 'lab_header.html' %}

<!-- ======= Hero Section ======= -->
<section id="hero" class="d-flex flex-column justify-content-center">
    <div class="container" data-aos="zoom-in" data-aos-delay="100">
        <p><span data-typed-items="Upload Medical Reports of {{data['name']}}" style="font-family:bold;color:white;font-size:50px"></span></p>

        <form method="post" enctype="multipart/form-data">
            <table border="2" class="table" style="width: 600px; background-color: rgba(0, 0, 0, 0.7);color:white">
                <tr>
                    <th>File</th>
                    <td><input type="file" class="form-control" name="file" required accept=".pdf"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" class="btn btn-primary" name="submit">
                    </td>
                </tr>
            </table>
        </form>

       
    </div>
</section><!-- End Hero -->
